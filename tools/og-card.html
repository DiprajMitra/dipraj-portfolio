<!DOCTYPE html>
<!--
    Open Graph card source.

    Rendered to a 1200x630 PNG by tools/build-og-card.js using the same
    headless Chrome that compiles the résumé, so it can use the site's
    real font stack and design tokens instead of a hand-rolled mock-up.

    The card is deliberately not a screenshot of the site: an OG card is
    read in a feed, at a glance, on a phone. It shows a name, a role and
    a domain, and nothing else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

    :root {
        --bg: #070b16;
        --bg-elevated: #0e1526;
        --text: #e8eefc;
        --text-muted: #9aa8c2;
        --accent: #6366f1;
        --accent-2: #8b5cf6;
        --cyan: #22d3ee;
        --border: rgba(148, 163, 184, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 72px 48px;
    }

    /* The site draws a fine grid over the page background — the card
       carries the same texture so it reads as the same product. */
    body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
        background-size: 48px 48px;
    }

    /* Two soft colour washes, matching the hero's gradient bloom. */
    body::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(760px 460px at 82% 18%, rgba(99, 102, 241, 0.32), transparent 62%),
            radial-gradient(620px 420px at 12% 96%, rgba(34, 211, 238, 0.16), transparent 60%);
    }

    .row { position: relative; z-index: 1; }

    /* ---- Brand row ---- */
    .brand {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .mark {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2) 55%, var(--cyan));
        display: grid;
        place-items: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        color: #fff;
        box-shadow: 0 10px 34px rgba(99, 102, 241, 0.42);
    }

    .domain {
        font-family: 'JetBrains Mono', monospace;
        font-size: 25px;
        font-weight: 500;
        color: var(--text);
        letter-spacing: -0.02em;
    }

    .domain span { color: var(--accent); }

    /* ---- Body row ---- */
    .body {
        display: flex;
        align-items: center;
        gap: 60px;
    }

    .copy { flex: 1; }

    h1 {
        font-size: 72px;
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.035em;
    }

    h1 em {
        font-style: normal;
        background: linear-gradient(100deg, var(--accent), var(--accent-2) 58%, var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .role {
        margin-top: 16px;
        font-size: 29px;
        font-weight: 600;
        color: var(--text-muted);
    }

    .tags {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        max-width: 620px;
    }

    .tag {
        font-size: 19px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(19, 27, 47, 0.72);
        color: var(--text-muted);
        white-space: nowrap;
    }

    /* ---- Portrait ---- */
    .portrait {
        width: 300px;
        height: 300px;
        flex: none;
        border-radius: 50%;
        overflow: hidden;
        border: 5px solid transparent;
        background: linear-gradient(135deg, var(--accent), var(--accent-2) 55%, var(--cyan)) border-box;
        box-shadow: 0 24px 70px rgba(99, 102, 241, 0.38);
    }

    .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
        border-radius: 50%;
        display: block;
    }

    /* ---- Foot row ---- */
    .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 22px;
        color: var(--text-muted);
    }

    .foot .who {
        font-weight: 600;
        color: var(--text);
    }

    .foot .who span {
        font-weight: 500;
        color: var(--text-muted);
    }
</style>
</head>
<body>
    <div class="row brand">
        <div class="mark">&gt;_</div>
        <div class="domain">dipraj<span>.bond</span></div>
    </div>

    <div class="row body">
        <div class="copy">
            <h1>Dipraj Mitra<br><em>Chandon</em></h1>
            <div class="role">Software Engineer &amp; Competitive Programmer</div>
            <div class="tags">
                <span class="tag">Full-Stack</span>
                <span class="tag">FastAPI</span>
                <span class="tag">Machine Learning</span>
                <span class="tag">Cybersecurity / CTF</span>
            </div>
        </div>
        <div class="portrait">
            <img src="IMG_SRC" alt="">
        </div>
    </div>

    <div class="row foot">
        <div class="who">দ্বীপরাজ মিত্র চন্দন <span>· Dipraj Mitra Chandon</span></div>
        <div>Computer Science, University of Asia Pacific</div>
    </div>
</body>
</html>
